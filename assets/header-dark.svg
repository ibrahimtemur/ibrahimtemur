<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Main Card Background -->
  <rect width="900" height="200" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="900" height="200" rx="16" fill="url(#grid)"/>

  <!-- Decorative Ambient Glows -->
  <circle cx="140" cy="40" r="140" fill="url(#glow)"/>
  <circle cx="760" cy="160" r="160" fill="url(#glow)"/>

  <!-- Top Accent Line -->
  <rect x="300" y="0" width="300" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Terminal / Code Tag Accents -->
  <text x="45" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#475569">&lt;developer profile="ibrahimtemur"&gt;</text>
  <text x="45" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#475569">&lt;/developer&gt;</text>

  <!-- Status Pill -->
  <rect x="715" y="24" width="145" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="731" cy="37" r="4.5" fill="#22c55e"/>
  <text x="744" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Open to Connect</text>

  <!-- Name -->
  <text x="450" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    İbrahim Temur
  </text>

  <!-- Subtitle with Gradient -->
  <text x="450" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="url(#accent)" letter-spacing="0.4">
    Full-Stack &amp; Cross-Platform Software Developer
  </text>

  <!-- Tech Stack Mini Subline -->
  <text x="450" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#94a3b8" letter-spacing="1.2">
    macOS • iOS • Android • React • Node.js • PostgreSQL
  </text>
</svg>
