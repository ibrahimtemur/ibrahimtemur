<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#cbd5e1" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Main Card Background -->
  <rect width="900" height="200" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="900" height="200" rx="16" fill="url(#grid)"/>

  <!-- Top Accent Line -->
  <rect x="300" y="0" width="300" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Terminal / Code Tag Accents -->
  <text x="45" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#64748b">&lt;developer profile="ibrahimtemur"&gt;</text>
  <text x="45" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#64748b">&lt;/developer&gt;</text>

  <!-- Status Pill -->
  <rect x="715" y="24" width="145" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="731" cy="37" r="4.5" fill="#16a34a"/>
  <text x="744" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Open to Connect</text>

  <!-- Name -->
  <text x="450" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="0.5">
    İbrahim Temur
  </text>

  <!-- Subtitle with Gradient -->
  <text x="450" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="url(#accent)" letter-spacing="0.4">
    Full-Stack &amp; Cross-Platform Software Developer
  </text>

  <!-- Tech Stack Mini Subline -->
  <text x="450" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#475569" letter-spacing="1.2">
    macOS • iOS • Android • React • Node.js • PostgreSQL
  </text>
</svg>
